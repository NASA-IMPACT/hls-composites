[project]
name = "hls-composites"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chris Holden", email = "ceholden@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "click>=8.1.0",
    "dask>=2025.10.0",
    "numpy>=2.1.0",
    "pystac>=1.12",
    "rasterio>=1.4.3",
    "rioxarray>=0.17.0",
    "xarray>=2025.1.0",
]

[project.scripts]
hls-composites = "hls_composites.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35.0",
    # The validation extra is dev-only: pystac fetches extension schemas over
    # HTTP, and the Batch compute environment has no route to the internet.
    "pystac[validation]>=1.12",
    "moto[sts]>=5.0",
    "mypy>=2.3.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0",
]
seed = [
    "earthaccess>=0.18.0",
]
deploy = [
    "aws-cdk-lib>=2.180.0",
    "batch-event-job-monitor[cdk]",
    "constructs>=10.4.2",
    "pydantic-settings>=2.8.0",
]

[tool.uv.sources]
# Unreleased: no tags or releases exist yet, so this tracks the PR branch and
# uv.lock pins the exact commit. Bump with:
#   uv lock --upgrade-package batch-event-job-monitor
batch-event-job-monitor = { git = "https://github.com/NASA-IMPACT/batch-event-job-monitor.git", branch = "feat/init" }

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# HLS granule IDs encode date-only day-of-year; naive datetimes are intentional.
ignore = ["DTZ007"]

[tool.ruff.lint.isort]
# `cdk.json` runs `python3 cdk/app.py`, so modules under `cdk/` import each other
# by bare name rather than through a package.
known-first-party = ["hls_constructs", "settings", "stack"]
combine-as-imports = true

[tool.mypy]
files = ["src", "cdk"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["cdk.out"]
# Fully-masked pixels legitimately trip these in nanmedian/nanstd.
filterwarnings = [
    "ignore:All-NaN slice encountered:RuntimeWarning",
    "ignore:Degrees of freedom <= 0:RuntimeWarning",
]
