name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The deploy group carries the CDK dependencies that cdk/ and tests/cdk/ need.
      - name: Install dependencies
        run: uv sync --frozen --group deploy

      # scripts/* are the single source of truth for these commands.
      - name: Lint
        run: ./scripts/lint

      - name: Typecheck
        run: ./scripts/typecheck

      - name: Test
        run: ./scripts/test

  deploy-dev:
    # Deploy to dev only on push (including merged PR) to `main`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit
