name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # scripts/* are the single source of truth for these commands.
      - name: Lint
        run: ./scripts/lint

      - name: Typecheck
        run: ./scripts/typecheck

      - name: Test
        run: ./scripts/test
