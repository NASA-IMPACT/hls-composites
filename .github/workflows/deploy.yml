name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  id-token: write # required for requesting the JWT (for OIDC)
  contents: read  # required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deployment settings come from this environment's variables, and the OIDC
    # subject claim is ":environment:<name>".
    environment: ${{ inputs.environment }}
    # `vars` here resolves against the environment above, so region is set per stage.
    env:
      AWS_DEFAULT_REGION: ${{ vars.MCP_ACCOUNT_REGION || 'us-west-2' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install deploy requirements
        run: |
          uv sync --frozen --group deploy
          npm install -g aws-cdk@v2.*
          cdk --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          role-session-name: ${{ github.actor }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Convert secrets and vars to environment variables
        # cdk/settings.py reads every stack setting from the environment, so the
        # environment's vars and secrets are what configure the deployment.
        shell: python
        run: |
          import os

          secrets_and_vars = {
              **${{ toJson(secrets) }},
              **${{ toJson(vars) }},
          }

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in secrets_and_vars.items():
                  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                  if "\n" in value:
                      print(f"{name}<<EOF\n{value}\nEOF", file=env_file)
                  else:
                      print(f"{name}={value}", file=env_file)

      - name: Deploy to ${{ inputs.environment }}
        run: uv run cdk deploy --require-approval never
