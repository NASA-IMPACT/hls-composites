name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        description: "Replaces the tag on the environment's PROCESSING_CONTAINER_ECR_URI"
        required: false
        type: string

defaults:
  run:
    shell: bash

permissions:
  id-token: write # required for requesting the JWT (for OIDC)
  contents: read  # required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deployment settings come from this environment's variables, and the OIDC
    # subject claim is ":environment:<name>".
    environment: ${{ inputs.environment }}
    # `vars` here resolves against the environment above, so region is set per stage.
    env:
      AWS_DEFAULT_REGION: ${{ vars.MCP_ACCOUNT_REGION || 'us-west-2' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"

      - name: Install deploy requirements
        run: |
          uv sync --frozen --group deploy
          npm install -g aws-cdk@v2.*
          cdk --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          role-session-name: ${{ github.actor }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Convert vars to environment variables
        # cdk/settings.py reads every stack setting from the environment, so the
        # environment's vars are what configure the deployment. Any secret must
        # be passed by name in the env block of the deploy step.
        shell: python
        run: |
          import os

          deploy_vars = ${{ toJson(vars) }}

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in deploy_vars.items():
                  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                  if "\n" in value:
                      print(f"{name}<<EOF\n{value}\nEOF", file=env_file)
                  else:
                      print(f"{name}={value}", file=env_file)

      - name: Use the requested image tag
        if: inputs.image_tag != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: echo "PROCESSING_CONTAINER_ECR_URI=${PROCESSING_CONTAINER_ECR_URI%:*}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Deploy to ${{ inputs.environment }}
        run: uv run cdk deploy --require-approval never
