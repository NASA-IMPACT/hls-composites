# Local dev stack: a RustFS fake-S3, a one-shot seeder that mirrors real HLS
# granules into it, and the CLI running against it. Inputs come from the
# environment; TILE/YEARMONTH default below.
#
#   docker compose up -d rustfs
#   docker compose run --rm seed
#   docker compose run --rm composite
#
# Seeding pulls from LP DAAC over HTTPS and needs Earthdata Login credentials:
# either a ~/.netrc with a urs.earthdata.nasa.gov entry (mounted below), or
# EARTHDATA_USERNAME / EARTHDATA_PASSWORD in the environment.
#
# MODE picks what the composite is built over -- indexes (the default) or the
# raw reflectance bands:
#
#   MODE=bands docker compose run --rm composite
#
# Both modes name their output directory after the tile-month alone, so running
# each in turn leaves their GeoTIFFs side by side in one folder.
#
# Override any knob inline (TILE=... YEARMONTH=...) or via a local .env file.
# Outputs land in ./out; the RustFS console is at http://localhost:9001.

# seed and composite are the same image, built once and tagged here so both
# services share it rather than each triggering its own build.
x-app: &app
  build:
    context: .
    target: dev
  image: hls-composites:dev

x-mounts:
  # Live source, picked up without a rebuild (project installed editable).
  src: &mount-src ./src:/app/src:ro
  # Holds the S3 client config AWS_CONFIG_FILE points at.
  docker: &mount-docker ./docker:/app/docker:ro

services:
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  # One-shot: copy real granules from LP DAAC into RustFS, over HTTPS.
  seed:
    <<: *app
    profiles: ["tools"]
    depends_on:
      - rustfs
    entrypoint: ["python", "docker/seed.py"]
    volumes:
      # Earthdata Login credentials for the LP DAAC reads, read-only. Mounted
      # at earthaccess's default lookup path, so no env var is needed.
      - ${HOME}/.netrc:/root/.netrc:ro
      # Live source, so edits are picked up without a rebuild
      - ./src:/app/src:ro
      - ./tests:/app/tests
      - ./docker:/app/docker:ro
      - ./scripts:/app/scripts:ro
    environment:
      TILE: ${TILE:-14TPN}
      YEARMONTH: ${YEARMONTH:-2015-07}
      LOCAL_BUCKET: ${LOCAL_BUCKET:-hls}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      # Optional Earthdata Login override, taking precedence over the .netrc.
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}

  # One-shot: run the CLI against RustFS to build the composite.
  composite:
    <<: *app
    profiles: ["tools"]
    depends_on:
      - rustfs
    command:
      - "--tile-id"
      - "${TILE:-14TPN}"
      - "--year-month"
      - "${YEARMONTH:-2015-07}"
      - "--bucket"
      - "${LOCAL_BUCKET:-hls}"
      - "--output-dir"
      - "/out"
      # MODE=indexes (default) or MODE=bands, spelled as the CLI flag.
      - "--${MODE:-indexes}"
    volumes:
      - ./out:/out
      - *mount-src
      - *mount-docker
    environment:
      # boto3 -> RustFS (discovery). Path-style addressing via the mounted config.
      AWS_ENDPOINT_URL_S3: http://rustfs:9000
      AWS_CONFIG_FILE: /app/docker/aws-config
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
      # GDAL / rasterio -> RustFS (band reads over /vsis3/).
      AWS_S3_ENDPOINT: rustfs:9000
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_EC2_METADATA_DISABLED: "true"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"

volumes:
  rustfs-data:
