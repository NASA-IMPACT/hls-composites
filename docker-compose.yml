# Local dev stack: a MinIO fake-S3, a one-shot seeder that mirrors real HLS
# granules into it, and the CLI running against it. Inputs come from the
# environment; TILE/YEARMONTH default below, PROD_BUCKET is required.
#
#   docker compose up -d minio
#   PROD_BUCKET=my-hls-bucket docker compose run --rm seed
#   docker compose run --rm composite
#
# Override any knob inline (TILE=... YEARMONTH=...) or via a local .env file.
# Outputs land in ./out; the MinIO console is at http://localhost:9001.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: copy real granules from PROD_BUCKET (real AWS) into MinIO.
  seed:
    build:
      context: .
      target: dev
    profiles: ["tools"]
    depends_on:
      - minio
    entrypoint: ["python", "docker/seed.py"]
    volumes:
      # Real AWS credentials for the source (production) reads, read-only.
      - ${HOME}/.aws:/root/.aws:ro
      # Live source, so edits are picked up without a rebuild (project is
      # installed editable). tests/docker/scripts for the dev inner loop.
      - ./src:/app/src:ro
      - ./tests:/app/tests
      - ./docker:/app/docker:ro
      - ./scripts:/app/scripts:ro
    environment:
      TILE: ${TILE:-14TPN}
      YEARMONTH: ${YEARMONTH:-2015-07}
      # Required at runtime; seed.py fails clearly if unset.
      PROD_BUCKET: ${PROD_BUCKET:-}
      LOCAL_BUCKET: ${LOCAL_BUCKET:-hls}
      PROD_REQUESTER_PAYS: ${PROD_REQUESTER_PAYS:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Pick a profile from the mounted ~/.aws if you use named/SSO profiles.
      AWS_PROFILE: ${AWS_PROFILE:-}

  # One-shot: run the CLI against MinIO to build the composite.
  composite:
    build:
      context: .
      target: prod
    profiles: ["tools"]
    depends_on:
      - minio
    command:
      - "--tile-id"
      - "${TILE:-14TPN}"
      - "--year-month"
      - "${YEARMONTH:-2015-07}"
      - "--bucket"
      - "${LOCAL_BUCKET:-hls}"
      - "--output-dir"
      - "/out"
    volumes:
      - ./out:/out
      # Live source, picked up without a rebuild (project installed editable).
      - ./src:/app/src:ro
    environment:
      # boto3 -> MinIO (discovery). Path-style addressing via the mounted config.
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_CONFIG_FILE: /app/docker/aws-config
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      # GDAL / rasterio -> MinIO (band reads over /vsis3/).
      AWS_S3_ENDPOINT: minio:9000
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_EC2_METADATA_DISABLED: "true"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"

volumes:
  minio-data:
